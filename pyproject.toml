[project]
name = "hive-mcp"
version = "0.1.0"
description = "Local MCP server for reading (and later controlling) Hive Active Heating"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp~=4.1",
    "keyring>=25.7.0",
    "pydantic>=2.9",
    "pyhive-integration==1.0.10",
]

[project.scripts]
hive-mcp = "hive_mcp.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["apyhiveapi", "apyhiveapi.*", "keyring", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
